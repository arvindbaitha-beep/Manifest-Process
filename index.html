<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ac:#1d4ed8;--bd:#d9dce2;--ok:#15803d;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mu:#9aa1ad;--ac:#6b9bff;--bd:#2d323b;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--tx:#eceef2;--mu:#9aa1ad;--ac:#6b9bff;--bd:#2d323b;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
main{padding:10px 10px 20px 98px;max-width:760px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:16px}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{padding:11px 14px;font-size:15px;border:3px solid var(--tx);border-radius:6px;background:var(--ac);color:#fff;font-weight:600;min-height:46px;padding-left:24px;padding-right:24px;letter-spacing:.3px}
button.g{background:var(--bd);color:var(--tx)}button.r{background:var(--er)}button.s{padding:6px 16px;min-height:34px;font-size:13px}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.seg button{flex:1;background:var(--bg);color:var(--tx)}.seg button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}.tile{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:10px;text-align:center}.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.big{font-size:34px;font-weight:700;text-align:center}.mu{color:var(--mu);font-size:12px}

.ov .bx{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:420px}.ov.bad .bx{border:4px solid var(--er)}
.ok{color:var(--ok)}.er{color:var(--er)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;white-space:nowrap}

.suggest-wrap{position:relative}.suggest-list{position:absolute;left:0;right:0;top:100%;z-index:15;max-height:220px;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 5px 14px rgba(0,0,0,.16)}.suggest-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:15px}.suggest-item:hover{background:var(--bd)}button,input,select{touch-action:manipulation}button:active{transform:scale(.97);filter:brightness(.88)}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:bm 1s linear infinite;display:none;z-index:30}@keyframes bm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

</style></head><body>
<div id="bar"></div><div id="toast"></div><div id="app"></div><div id="ovl"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const ist=(d=new Date())=>d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true});
const dayK=(d=new Date())=>d.toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let db,cfg,me,cur=null,rcur=null,tab='scan',unsub=null,MAX=2000;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.frequency.value=220;o.type='square';o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},500);navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function modal(html,bad){return new Promise(res=>{const o=$('#ovl');o.innerHTML=`<div class="ov ${bad?'bad':''}"><div class="bx">${html}</div></div>`;o.onclick=e=>{const v=e.target.dataset?.v;if(v!==undefined){const iv=[...o.querySelectorAll('input,select')].map(i=>i.value);o.innerHTML='';res(v==='ok'?(iv.length?iv:true):false)}};setTimeout(()=>o.querySelector('input')?.focus(),50)})}
const ask=async t=>{const r=await modal(`<h3>${t}</h3><input autocapitalize="characters"><div class="row" style="margin-top:10px"><button class="g" data-v="no">Cancel</button><button data-v="ok">Add</button></div>`);return r&&r[0]};
const yn=(t,b='Confirm')=>modal(`<h3>${t}</h3><div class="row"><button class="g" data-v="no">Back</button><button class="r" data-v="ok">${b}</button></div>`);
const dupe=(a,w)=>{beep();return modal(`<h3 class="er">⚠ DUPLICATE / ERROR</h3><p><b>${esc(a)}</b></p><p>${w}</p><p class="mu">Set this shipment aside, then press OK.</p><button class="r" style="width:100%" data-v="ok">Shipment set aside – OK</button>`,1)};
async function save(name,data){try{const b=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Download failed: '+e.message)}}
function csv(rows){if(!rows.length)return'';const k=Object.keys(rows[0]);return '\ufeff'+[k.join(','),...rows.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}
const col=async(n,q)=>{let c=db.collection(n);(q||[]).forEach(w=>c=c.where(...w));return(await c.get()).docs.map(d=>d.data())};
const sf=s=>s.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
const log=(a,d)=>gs('add','audit',{id:Date.now()+'-'+Math.random().toString(36).slice(2,6),a,d,user:me.id,ts:ist(),day:dayK()}).catch(()=>{});
const crow=(m,arr,k)=>arr.map((x,i)=>({Serial:i+1,Manifest:m.id,Seller:x.seller,Channel:x.channel,Courier:x.courier,AWB:x.awb,...(k==='R'?{ForwardManifest:x.fm}:{}),ScannedAt:x.tsStr,User:x.user}));

const SS={g:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},r:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
// Backend address (your Apps Script web app). Used when this page is hosted outside Google, e.g. GitHub Pages.
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbzhMqIkDBu-Y-2LPhC3_I0WRhiVMETqMHbj6YgWLzwEUlOENbBAXlHsI1YGvAkwfH8a/exec';
const gs0=(op,...a)=>window.google&&google.script&&google.script.run
 ?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e&&e.message||e))).api(op,...JSON.parse(JSON.stringify(a))))
 :fetch(WEBAPP_URL,{method:'POST',body:JSON.stringify({args:[op,...a]})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.e);return j.r});
let np=0;const BG=['saveScans','tail','add','setMany','awbs'],bar=d=>{np+=d;const e=document.getElementById('bar');if(e)e.style.display=np>0?'block':'none'};   // top progress bar for anything the user is waiting for
const gs=(op,...a)=>{const f=!BG.includes(op)&&a[0]!=='_';if(f)bar(1);return gs0(op,...a).finally(()=>{if(f)bar(-1)})};
function mkdb(){const D=(c,id)=>({get:async()=>{const r=await gs('get',c,id);return{exists:!!r,data:()=>r}},set:o=>gs('set',c,id,o),delete:()=>gs('del',c,id)});
 return{doc:p=>{const i=p.indexOf('/');return D(p.slice(0,i),p.slice(i+1))},collection:c=>{const w=[],q={where:(...a)=>{w.push(a);return q},get:async()=>({docs:(await gs('query',c,w)).map(x=>({data:()=>x}))}),doc:id=>D(c,id),onSnapshot:f=>{let on=1,t;const run=async()=>{try{const r=await q.get();on&&f(r)}catch(e){}if(on)t=setTimeout(run,8000)};run();return()=>{on=0;clearTimeout(t)}}};return q}}}
// fast scanning: instant local checks, background batch sync to the Sheet
let KN=new Map(),RT=new Map(),Q={F:[],R:[],M:[]},fl=false,again=false;
const pend=()=>{const e=$('#pend');if(e){const n=Q.F.length+Q.R.length;e.textContent=n?'Syncing '+n+'…':'✔ All synced'}const e2=$('#sv');if(e2)e2.textContent=(Q.F.length+Q.R.length+Q.M.length)?'Saving to Google Sheet…':'✔ Saved to Google Sheet';};
async function loadKN(k){const r=await gs('awbs','scans');KN=mkKN(r.rows);KN.n=r.total;}
async function flush(){if(fl){again=true;return}fl=true;try{for(const k of['F','R'])while(Q[k].length){const b=Q[k].splice(0,300);let r;try{r=await gs('saveScans',k,b)}catch(e){Q[k].unshift(...b);throw e}qsave();
 for(const d of r.dups||[]){const it=b.find(x=>x.awb===d.awb&&(x.seller||'')===(d.seller||''));if(it&&(it.manifest||it.cm)===d.manifest)continue;[...SESS,cur,rcur].forEach(x=>x&&x.list&&x.list.delete(d.awb));const m=k==='F'?cur:rcur;k==='F'?kAdd([d.awb,d.manifest,d.seller||'','','','']):RT.set((d.seller||'')+'|'+d.awb,d.manifest);const c=$('#cnt');if(c&&m&&m.list)c.textContent=m.list.size;dupe(d.awb,'Rejected by server – already scanned in <b>'+esc(d.manifest)+'</b>.')}}while(Q.M.length){await gs('setMany',Q.M[0].c,Q.M[0].S,Q.M[0].E);Q.M.shift();qsave()}}catch(e){toast('Sync error, retrying: '+(e.message||e))}fl=false;pend();if(again){again=false;flush()}}
const drain=async()=>{for(let i=0;i<40&&(Q.F.length||Q.R.length||Q.M.length||fl);i++){await flush();await new Promise(r=>setTimeout(r,250))}if(Q.F.length||Q.R.length||Q.M.length){toast('Sync pending – check connection and try again');return false}return true};
setInterval(flush,2000);
const CLOSED=new Set(),HELD={},DC={},qsave=()=>{try{localStorage.setItem('wms_q',JSON.stringify(Q))}catch(e){}};
try{const q=JSON.parse(localStorage.getItem('wms_q'));if(q){Q.F=q.F||[];Q.R=q.R||[];Q.M=q.M||[]}}catch(e){}   // unsent scans survive a reload / lost connection
async function init(k,m){const nw=m.new,wk=!KNl[k]&&!KNp[k];if(!nw&&m.list&&!wk)return;if(wk)KNp[k]=1;
 const p=gs('scanInit',k,m.id,nw?mt(m):null,wk).then(r=>{if(!m.list)m.list=new Map(r.mine.sort((a,b)=>a.n-b.n).map(x=>[x.awb,x]));
  if(wk){const L=KN;KN=mkKN(r.rows);KN.n=r.total;L.forEach(l=>l.forEach(x=>kAdd(x)));if(k==='R')RT=new Map(r.rt.map(x=>[x[2]+'|'+x[0],x[1]]));KNl[k]=1;KNp[k]=0}
  if(nw){delete m.new;log('create',m.id)}}).catch(e=>{KNp[k]=0;throw e});
 if(nw&&(k==='F'||KNl.R)){if(!m.list)m.list=new Map();p.catch(e=>toast('Sync error: '+(e.message||e)));return}   // new dispatch manifest: start scanning at once
 await p}
function preload(){if(KNl.F||KNp.F)return;KNp.F=1;   // load duplicate-check + cancel data in the background right after login
 Promise.all([gs('awbs','scans'),gs('awbs','returns').catch(()=>null)]).then(([r,q])=>{const L=KN;KN=mkKN(r.rows);KN.n=r.total;L.forEach(l=>l.forEach(x=>kAdd(x)));KNl.F=1;
  if(q){const O=RT;RT=new Map(q.rows.map(x=>[x[2]+'|'+x[0],x[1]]));O.forEach((v,a)=>RT.set(a,v));KNl.R=1}KNp.F=0}).catch(()=>{KNp.F=0})}

let SESS=[],cfg0;
let KNl={F:0,R:0},KNp={};
const MINLEN=6,AUTO_MS=120;   // auto-submit: AWB with at least MINLEN characters, AUTO_MS after the last scanner character
const kAdd=(x,M)=>{M=M||KN;const l=M.get(x[0]);if(!l)M.set(x[0],[x]);else if(!l.some(e=>e[2]===x[2]))l.push(x)};   // AWB -> one entry per seller
const mkKN=rows=>{const M=new Map();rows.forEach(x=>kAdd(x,M));return M};
const mt=x=>{const{list,new:_n,...r}=x;return r};
const snap=()=>JSON.stringify({s:cfg.sellers,c:cfg.channels,o:cfg.couriers,u:cfg.users});
async function saveCfg(){const o=JSON.parse(cfg0),P={add:{},rem:{},uset:[],udel:[]};  // send only the changes; server merges atomically
 ['sellers','channels','couriers'].forEach((k,i)=>{const a=o['sco'[i]];P.add[k]=cfg[k].filter(x=>!a.includes(x));P.rem[k]=a.filter(x=>!cfg[k].includes(x))});
 cfg.users.forEach(u=>{const p=o.u.find(x=>x.id===u.id);if(!p||JSON.stringify(p)!==JSON.stringify(u))P.uset.push(u)});o.u.forEach(p=>{if(!cfg.users.find(u=>u.id===p.id))P.udel.push(p.id)});
 cfg=await gs('cfgPatch',P);cfg0=snap();try{localStorage.setItem('wms_cfg',JSON.stringify(cfg))}catch(e){}}
async function mkM(k,s,c,o){const n=new Date(),id=(k==='F'?`${sf(s)}-${sf(c)}-${sf(o)}-`:'CNL-')+dayK(n).replace(/-/g,'').slice(2)+'-'+n.toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata'}).replace(/:/g,'').slice(0,6)+Math.floor(Math.random()*90+10);
 const m={id,seller:s||'',channel:c||'',courier:o||'',user:me.id,created:n.toISOString(),createdStr:ist(n),day:dayK(n),status:'open',count:0};
 m.new=1;return m}
let syn=0;async function syncKN(){if(KN.n===undefined||fl||syn)return;syn=1;try{const r=await gs('tail','scans',KN.n);if(r.reset)await loadKN('F');else{r.rows.forEach(x=>kAdd(x));KN.n=r.total}}catch(e){}syn=0}
setInterval(()=>{if($('#sc')&&document.visibilityState!=='hidden')syncKN()},8000);
setInterval(()=>{if(document.visibilityState!=='hidden')gs('get','_').catch(()=>{})},150000);   // keeps the Google backend awake
async function boot(){
 db=mkdb();A.innerHTML='<main><div class="card mu">Connecting to Google Sheet…</div></main>';
 let cc=null;try{cc=JSON.parse(localStorage.getItem('wms_cfg'))}catch(e){}
 if(cc&&cc.users){cfg=cc;cfg0=snap();const u0=SS.g('u');if(u0)me=cfg.users.find(x=>x.id===u0);me?home():login();   // instant start from the saved lists; refresh quietly in the background
  db.doc('config/main').get().then(r=>{if(r.exists){cfg=r.data();cfg0=snap();try{localStorage.setItem('wms_cfg',JSON.stringify(cfg))}catch(e){}}}).catch(()=>{});return}
 const s=await db.doc('config/main').get();
 cfg=s.exists?s.data():{sellers:[],channels:[],couriers:[],users:[{id:'admin',pw:'admin123',role:'admin'}]};
 cfg0=s.exists?snap():'{"s":[],"c":[],"o":[],"u":[]}';if(!s.exists)await saveCfg();try{localStorage.setItem('wms_cfg',JSON.stringify(cfg))}catch(e){}
 const u=SS.g('u');if(u)me=cfg.users.find(x=>x.id===u);
 me?home():login()}
function login(){A.innerHTML=`<main><div class="card"><h3>📦 Manifest &amp; Dispatch WMS</h3><label>User ID</label><input id="u" autocapitalize="none"><label>Password</label><input id="p" type="password"><button style="width:100%;margin-top:12px" id="lg">Login</button><div class="mu" style="font-size:10px;margin-top:2px;text-align:right">Owned By Arvind</div></div></main>`;
 $('#lg').onclick=async()=>{const id=$('#u').value.trim(),p=$('#p').value,h=await sha(p),ff=()=>cfg.users.find(x=>x.id===id&&(x.ph===h||(!x.ph&&x.pw===p)));let x=ff();if(!x){try{const f=await db.doc('config/main').get();if(f.exists){cfg=f.data();cfg0=snap()}}catch(e){}x=ff()}if(!x)return toast('Invalid ID or password');
  if(!x.ph){x.ph=h;delete x.pw;await saveCfg()}me=x;SS.s('u',x.id);home()}}
function home(){const T=[['scan','Dispatch','📤'],['ret','Return','↩️'],['mf','Manifests','📋'],['dash','Dashboard','📊'],['rep','Reports','📑'],...(me.role==='admin'?[['adm','Admin','⚙️']]:[])];
 A.innerHTML=`<div class="hd"><b>📦 Manifest &amp; Dispatch WMS</b><div><span class="mu">${esc(me.id)} (${me.role}) <button class="s g" id="lo">Logout</button></span><div class="mu" style="font-size:10px;margin-top:2px;text-align:right">Owned By Arvind</div></div></div><main id="v"></main><nav>${T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}"><b>${t[2]}</b>${t[1]}</button>`).join('')}</nav>`;
 $('#lo').onclick=()=>{SS.r('u');cur=rcur=null;SESS=[];KNl={F:0,R:0};KNp={};me=null;login()};
 document.querySelector('nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;home()}};
 if(unsub){unsub();unsub=null}
 preload();
 ({scan:()=>scanV('F'),ret:()=>scanV('R'),mf,dash,rep,adm})[tab]()}
const opts=a=>'<option value="">-- select --</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('');
function suggestField(id,label){return `<label>${label}</label><div class="suggest-wrap"><input id="${id}" autocomplete="off" autocapitalize="off" placeholder="Type at least 1 character to search"><div class="suggest-list" id="${id}_list" hidden></div></div>`}
function wireSuggest(id,items){const el=$('#'+id),list=$('#'+id+'_list');if(!el||!list)return;const draw=()=>{const q=el.value.trim().toLocaleLowerCase();if(q.length<1){list.hidden=true;list.innerHTML='';return}const m=items.filter(x=>String(x).toLocaleLowerCase().includes(q)).slice(0,50);list.innerHTML=m.length?m.map(x=>`<div class="suggest-item" data-value="${esc(x)}">${esc(x)}</div>`).join(''):'<div class="suggest-item mu">No matching names found</div>';list.hidden=false};el.addEventListener('input',draw);el.addEventListener('focus',draw);list.addEventListener('mousedown',e=>{const x=e.target.closest('[data-value]');if(!x)return;e.preventDefault();el.value=x.dataset.value;list.hidden=true});el.addEventListener('keydown',e=>{if(e.key==='Escape')list.hidden=true});document.addEventListener('click',e=>{if(!e.target.closest('.suggest-wrap'))list.hidden=true})}


// ---------- create / resume manifest (F = dispatch, R = cancel/return)
async function scanV(k){const m=k==='F'?cur:rcur,V=$('#v');if(m)return scanning(k);
 const cn=k==='F'?'manifests':'cmanifests';let open=[];
 V.innerHTML=`<div class="card"><h3>${k==='F'?'Create New Outward Manifest':'New Cancel/Return Manifest'}</h3>
 ${k==='F'?`${suggestField('s','Seller')}${suggestField('c','Channel')}${suggestField('o','Courier')}`:'<p class="mu">Seller, channel and courier are matched automatically from the dispatch scan.</p>'}
 <button style="width:100%;margin-top:12px" id="go">Submit – Create Manifest</button></div>
 <div id="opn"></div>`;
 if(k==='F'){wireSuggest('s',cfg.sellers);wireSuggest('c',cfg.channels);wireSuggest('o',cfg.couriers)}
 const showO=r=>{open=r;if($('#opn'))$('#opn').innerHTML=r.length?`<div class="card"><h3>Open manifests (resume)</h3>${r.map(o=>`<div class="row" style="margin:4px 0"><span>${esc(o.id)}</span><button class="s g" data-r="${esc(o.id)}">Resume</button></div>`).join('')}</div>`:''},
  held=()=>Object.values(HELD).filter(o=>o.user===me.id&&(k==='F')===!!o.seller&&!CLOSED.has(o.id));

 <label>Report</label><select id="r"><option value="1">1. Manifest data (date wise)</option><option value="2">2. Actual dispatch (Scanned vs Cancelled)</option><option value="3">3. Cancel – date/seller/channel wise</option><option value="4">4. User wise (forward + cancel)</option><option value="5">5. Dispatch pending (Scanned − Cancelled &gt; 0)</option><option value="6" selected>6. DISPATCH REPORT – full AWB detail (download)</option><option value="7">7. Courier handover register</option></select>
 <button style="width:100%;margin-top:10px" id="run">Show report</button></div><div id="out"></div>`;
 $('#pd').onchange=e=>{const v=e.target.value,z=new Date();let a=z,b=z;if(v==='y')a=b=new Date(z-864e5);else if(v==='7')a=new Date(z-6*864e5);else if(v==='30')a=new Date(z-29*864e5);else if(v==='tm')a=new Date(z.getFullYear(),z.getMonth(),1);else if(v==='lm'){a=new Date(z.getFullYear(),z.getMonth()-1,1);b=new Date(z.getFullYear(),z.getMonth(),0)}if(v!=='c'){$('#f').value=dayK(a);$('#t').value=dayK(b)}};
 $('#run').onclick=async()=>{const f=$('#f').value,t=$('#t').value,r=$('#r').value,q=[['day','>=',f],['day','<=',t]],o=$('#out');o.innerHTML='<div class="card mu">Loading…</div>';
  const grp=(a,keys)=>{const m={};a.forEach(x=>{const k=keys.map(c=>x[c]).join('|');m[k]=m[k]||Object.fromEntries(keys.map(c=>[c,x[c]]));m[k].n=(m[k].n||0)+1});return Object.values(m)};
  let rows=[],ms=[],P=[];
  if(r==='1'||r==='7'){ms=await col('manifests',q);if(r==='7')ms=ms.filter(m=>m.hand);rows=ms.map(m=>({Manifest:m.id,Seller:m.seller,Channel:m.channel,Courier:m.courier,User:m.user,Created:m.createdStr,Closed:m.closedStr||'',Status:m.status,Packets:m.count,...(r==='7'?{Pickup_Person:m.hand.by,Vehicle:m.hand.veh,Handover_At:m.hand.at}:{})}))}
  else if(r==='2'){const S=await col('scans',q),C=await col('returns',q),ds=[...new Set([...S,...C].map(x=>x.day))].sort();rows=ds.map(d=>{const a=S.filter(x=>x.day===d).length,b=C.filter(x=>x.day===d).length;return{Date:d,Scanned:a,Cancelled:b,Actual_Dispatch:a-b}})}
  else if(r==='3'){rows=grp(await col('returns',q),['day','seller','channel']).map(x=>({Date:x.day,Seller:x.seller,Channel:x.channel,Cancelled:x.n}))}
  else if(r==='4'){const S=await col('scans',q),C=await col('returns',q),us=[...new Set([...S,...C].map(x=>x.user))];rows=us.map(u=>({User:u,Forward_Scanned:S.filter(x=>x.user===u).length,Cancel_Scanned:C.filter(x=>x.user===u).length}))}
  else if(r==='6'){const S=await col('scans',q),C=new Set((await col('returns',[['day','>=',f]])).map(x=>x.seller+'|'+x.awb));rows=S.sort((a,b)=>a.ts.localeCompare(b.ts)).map(x=>({Date:x.day,Manifest:x.manifest,Seller:x.seller,Channel:x.channel,Courier:x.courier,AWB:x.awb,User:x.user,ScannedAt:x.tsStr,Status:C.has(x.seller+'|'+x.awb)?'Cancelled':'Dispatched'}))}
  else{const S=await col('scans',q),C=new Set((await col('returns',[['day','>=',f]])).map(x=>x.seller+'|'+x.awb));P=S.filter(x=>!C.has(x.seller+'|'+x.awb));
   rows=grp(S,['manifest','seller','channel','courier']).map(x=>{const p=P.filter(y=>y.manifest===x.manifest).length;return{Manifest:x.manifest,Seller:x.seller,Channel:x.channel,Courier:x.courier,Scanned:x.n,Cancelled:x.n-p,Pending:p}}).filter(x=>x.Pending>0)}
  if(!rows.length)return o.innerHTML='<div class="card mu">No data found.</div>';
  const k=Object.keys(rows[0]),sh=rows.slice(0,300);o.innerHTML=`<div class="card"><div class="row" style="margin-bottom:8px"><button class="s" id="dl">⬇ CSV (${rows.length} rows)</button>${r==='1'?'<button class="s g" id="da">⬇ AWB detail CSV</button>':''}${r==='5'?'<button class="s g" id="da">⬇ Pending AWB list</button>':''}</div>${rows.length>300?'<div class="mu">Showing the first 300 rows on screen; the CSV has all data.</div>':''}<div class="tw"><table><tr>${k.map(c=>`<th>${c}</th>`).join('')}${r==='1'?'<th></th>':''}</tr>${sh.map((x,i)=>`<tr>${k.map(c=>`<td>${esc(x[c])}</td>`).join('')}${r==='1'?`<td><button class="s" data-p="${i}">PDF</button></td>`:''}</tr>`).join('')}</table></div></div>`;
  $('#dl').onclick=()=>save(`report${r}_${f}_${t}.csv`,csv(rows));
  if($('#da'))$('#da').onclick=async()=>{const D=r==='5'?P:await col('scans',q);save(`awb_detail_${f}_${t}.csv`,csv(D.map(x=>({Manifest:x.manifest,Seller:x.seller,Channel:x.channel,Courier:x.courier,AWB:x.awb,User:x.user,ScannedAt:x.tsStr}))))};
  o.onclick=async e=>{const i=e.target.dataset.p;if(i===undefined)return;const m=ms[i],a=(await col('scans',[['manifest','==',m.id]])).sort((a,b)=>a.n-b.n);pdf(m,a,'F')}}}

// ---------- admin
function adm(){const V=$('#v'),L=(h,key)=>`<div class="card"><h3>${h}</h3><div>${cfg[key].map(x=>`<span class="chip">${esc(x)}<a data-d="${key}|${esc(x)}">✕</a></span>`).join('')||'<span class="mu">—</span>'}</div><div class="row" style="margin-top:6px"><input id="n_${key}" autocapitalize="characters"><button class="p" style="flex:0 0 96px" data-a="${key}">Add</button></div></div>`;
 V.innerHTML=L('Sellers','sellers')+L('Channels','channels')+L('Couriers','couriers')+`<div class="card"><h3>Users</h3><div>${cfg.users.map(u=>`<span class="chip">${esc(u.id)} (${u.role})${u.id!==me.id?`<a data-u="${esc(u.id)}">✕</a>`:''}</span>`).join('')}</div><label>User ID</label><input id="nu" autocapitalize="none"><label>Password (new / change)</label><input id="np"><label>Role</label><select id="nr"><option>user</option><option>admin</option></select><button style="margin-top:8px" id="au">Add / update user</button></div>
 <div class="card"><h3>💾 Backend data backup</h3><p class="mu">All scanned data is stored in the backend database. Download everything from here.</p><div class="row"><button class="s" data-b="json">Full backup (JSON)</button><button class="s g" data-b="scans">All Scans CSV</button></div><div class="row" style="margin-top:6px"><button class="s g" data-b="returns">All Cancels CSV</button><button class="s g" data-b="manifests">All Manifests CSV</button><button class="s g" data-b="audit">Audit log CSV</button></div></div>
 <div class="card"><h3>Master data upload</h3><p class="mu">CSV columns: Seller, Channel, Courier. Existing entries are kept; new ones are added.</p><button class="s g" id="tp" style="margin-bottom:8px">⬇ Download template CSV</button><input type="file" id="fu" accept=".csv,.txt"><div id="um" class="mu" style="margin-top:6px"></div></div>
 <div class="card"><h3>📁 Master file location</h3><p class="mu">All data is saved live in your Google Sheet:<br><b>Master</b> (Seller/Channel/Courier – also editable in the sheet), <b>Scans</b>, <b>Manifests</b>, <b>Returns</b>, <b>CancelManifests</b>, <b>Audit</b>, <b>Config</b><br><a href="https://docs.google.com/spreadsheets/d/1ITwmjxJ_RB0xMNuEodQwxQLec2-fEpWdGDL8e0AVFbc/edit" target="_blank">Open Google Sheet</a></p><button class="s" data-b="master">⬇ Download master file (CSV)</button></div>`;
 V.onclick=async e=>{const t=e.target.dataset,a=t.a;
  if(t.d){const[k,v]=t.d.split('|');cfg[k]=cfg[k].filter(x=>x!==v);await saveCfg();return adm()}
  if(t.u){if(!await yn('Remove user '+esc(t.u)+'?','Remove'))return;cfg.users=cfg.users.filter(u=>u.id!==t.u);await saveCfg();return adm()}
  if(t.b==='master'){const n=Math.max(...['sellers','channels','couriers'].map(k=>cfg[k].length)),rw=[];for(let i=0;i<n;i++)rw.push({Seller:cfg.sellers[i]||'',Channel:cfg.channels[i]||'',Courier:cfg.couriers[i]||''});return rw.length?save('master_file_'+dayK()+'.csv',csv(rw)):toast('No master data')}
  if(t.b){const n=t.b;if(n==='json'){const o={exported:ist(),master:{sellers:cfg.sellers,channels:cfg.channels,couriers:cfg.couriers}};for(const c of['manifests','cmanifests','scans','returns','expected','audit'])o[c]=await col(c);return save('WMS_backup_'+dayK()+'.json',JSON.stringify(o))}
   const d=await col(n);return d.length?save(n+'_all_'+dayK()+'.csv',csv(d)):toast('No data available')}
  if(!a)return;const v=$('#n_'+a).value.trim().toUpperCase();if(v&&!cfg[a].includes(v)){cfg[a].push(v);await saveCfg();adm()}};
 $('#au').onclick=async()=>{const id=$('#nu').value.trim(),pw=$('#np').value;if(!id||!pw)return toast('Enter ID and password');cfg.users=cfg.users.filter(u=>u.id!==id);cfg.users.push({id,ph:await sha(pw),role:$('#nr').value});await saveCfg();if(id===me.id)me=cfg.users.find(u=>u.id===id);adm()};
 $('#tp').onclick=()=>save('master_template.csv','\ufeffSeller,Channel,Courier\nSELLER1,AMAZON,DELHIVERY\nSELLER2,FLIPKART,ECOM EXPRESS\n');
 $('#fu').onchange=async e=>{const f=e.target.files[0];if(!f)return;const ls=(await f.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/[,\t;]/).map(c=>c.replace(/^"|"$/g,'').trim().toUpperCase()));
  const h=ls[0],ix=n=>h.indexOf(n);let si=ix('SELLER'),ci=ix('CHANNEL'),oi=ix('COURIER'),rows=ls;
  if(si<0&&ci<0&&oi<0){si=0;ci=1;oi=2}else rows=ls.slice(1);
  const n={sellers:0,channels:0,couriers:0};
  rows.forEach(r=>[[si,'sellers'],[ci,'channels'],[oi,'couriers']].forEach(([i,k])=>{const v=i>=0&&r[i];if(v&&!cfg[k].includes(v)){cfg[k].push(v);n[k]++}}));
  ['sellers','channels','couriers'].forEach(k=>cfg[k].sort());await saveCfg();log('master upload',JSON.stringify(n));toast(`Added: ${n.sellers} sellers, ${n.channels} channels, ${n.couriers} couriers`);adm()}}
boot().catch(e=>{A.innerHTML='<main><div class="card er">Cannot connect to Google Sheet: '+esc(e.message)+'</div>'+(/fetch|network|json|unexpected/i.test(e.message)?'<div class="card mu">Cannot reach the backend. Check that the Apps Script web app is deployed with access <b>Anyone</b>, the latest Code.gs is deployed (New version) and WEBAPP_URL in this file is correct.</div>':'')+(/not a function/.test(e.message)?'<div class="card"><b>Backend (Code.gs) is not deployed correctly.</b><p class="mu">1) Apps Script → Code.gs: paste the latest Code.gs and Save.<br>2) Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy.<br>3) Open the web app URL followed by <b>?check=1</b>. It must show "api(): function" and "Sheet OK".</p></div>':'')+'</main>'});
</script></body></html>
